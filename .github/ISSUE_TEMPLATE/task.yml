name: Implementation task
description: One complete, independently verifiable improvement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem and intended behavior
      description: Explain the current behavior and what a user should experience instead.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Checkable outcomes, including relevant failures or edge cases.
      placeholder: '- [ ] ...'
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope and exclusions
      description: Include the layers needed for a working outcome; state what belongs in another task.
    validations:
      required: true
  - type: textarea
    id: dependencies
    attributes:
      label: Dependencies and context
      description: Link the parent spec, blocking issues, relevant evidence, and known decisions.
  - type: textarea
    id: verification
    attributes:
      label: Verification
      description: Meaningful behavior checks, device QA, and live/deployment checks where relevant.
    validations:
      required: true
